# configs/pima.yaml
# File is named 'pima.yaml' (README's convention); the actual dataset
# folder is dataset/pimadiabetes/, so `dataset:` below must say that.
dataset: pimadiabetes

# README's benchmark table: no protected feature for Pima -- it
# exercises the monotone-only path. main.py currently only drives
# repair via spec.protected, so an empty list here honestly means "no
# repair rounds run for this dataset yet", not a missing declaration.
spec:
  protected: []
  monotone:
    Glucose: up
  immutable: []
  integer_features: [Pregnancies]
  one_hot_groups: {}
  ranges: {}
  functional_deps: []
