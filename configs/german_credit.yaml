# configs/german_credit.yaml
dataset: german_credit

# German Credit's classic UCI attribute set has no standalone 'gender'
# column -- PersonalStatusSex conflates marital status and sex (a known
# limitation of this dataset), so it's the closest available proxy.
# No ranges/functional_deps are declared: README's benchmark table
# doesn't specify any for this dataset, and they are not inferred here.
spec:
  protected: [PersonalStatusSex, Age]
  monotone:
    CreditAmount: down
    Duration: down
  immutable: []
  integer_features: [
    Duration,
    CreditAmount,
    Age]
  one_hot_groups: {}
  ranges: {}
  functional_deps: []
